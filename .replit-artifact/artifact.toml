kind = "web"
previewPath = "/"
title = "Cabin Crew Coach"
version = "1.0.0"
id = "artifacts/cabin-crew-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21325

[services.development]
run = "pnpm --filter @workspace/cabin-crew-coach run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cabin-crew-coach", "run", "build" ]
